name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start complete stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Exercise payment, idempotency, ledger and RBAC
        run: python tests/integration/smoke.py
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color > integration-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-logs
          path: integration-logs.txt
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
