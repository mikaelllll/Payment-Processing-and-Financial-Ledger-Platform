[project]
name = "payment-ledger-platform"
version = "1.0.0"
description = "Production-style payment orchestration and double-entry ledger simulation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0",
  "aiosqlite==0.21.0",
  "redis==6.4.0",
  "pydantic-settings==2.10.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501"]
